none}.notice{padding:12px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;color:var(--muted);font-size:13px}.empty{text-align:center;padding:36px;color:var(--muted)}
@media(max-width:720px){.hero,.settings-grid{grid-template-columns:1fr}.collections,.coins{grid-template-columns:1fr}.big{font-size:29px}.topin{padding:11px 12px}main{padding:16px 12px}.card{padding:15px}.quick .label{display:none}}

C.forEach(c=>c.coins=c.coins.map((x,i)=>({id:c.id+'-'+i,year:x[0],place:x[1],title:x[2],collection:c.id,order:i})));
const all=()=>C.flatMap(c=>c.coins);
const S={lang:localStorage.coinLang||'en',theme:localStorage.coinTheme||'dark',page:'home',collection:null,filter:'all',sort:'release',query:'',reviewIndex:0};
let D=JSON.parse(localStorage.coinData||'{}');
const t=(en,es)=>S.lang==='es'?es:en; const save=()=>localStorage.coinData=JSON.stringify(D); const state=id=>(D[id]||{}).state||'unverified'; const wanted=id=>!!(D[id]||{}).wanted;
function setState(id,s){D[id]=D[id]||{};D[id].state=s;if(s==='have')D[id].wanted=false;save();render()}
function toggleWanted(id){D[id]=D[id]||{};D[id].wanted=!D[id].wanted;save();render()}
function stats(coins=all()){let a={have:0,missing:0,unverified:0,wanted:0,total:coins.length};coins.forEach(x=>{a[state(x.id)]++;if(wanted(x.id))a.wanted++});return a}
function nav(){let items=[['home','⌂','Home','Inicio'],['collections','🪙','Collection','Colección'],['wanted','★','Wanted','Buscadas'],['search','⌕','Search','Buscar'],['settings','⚙','Settings','Ajustes']];document.getElementById('nav').innerHTML=items.map(x=>`<button class="${S.page===x[0]?'active':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${t(x[2],x[3])}</button>`).join('')}
function go(p){S.page=p;S.collection=null;S.query='';render()}
function collectionCard(c){let a=stats(c.coins),pct=Math.round(a.have/a.total*100);return `<div class="card collection" onclick="openCol('${c.id}')"><div class="row"><div style="font-size:28px">${c.icon}</div><div class="grow"><h3>${S.lang==='es'?c.es:c.name}</h3><div class="muted">${c.period} · ${c.denom} · ${c.coins.length} ${t('designs','diseños')}</div></div><span class="badge">${a.have}/${a.total}</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="meta">❔ ${a.unverified} · ❌ ${a.missing} · ⭐ ${a.wanted}</div></div>`}
function home(){let a=stats(),pct=Math.round(a.have/a.total*100);return `<section class="hero"><div class="card"><div class="muted">${t('OVERALL PROGRESS','PROGRESO GENERAL')}</div><div class="big">${a.have} / ${a.total}</div><div class="progress"><i style="width:${pct}%"></i></div><div class="stats"><div class="stat"><b>${pct}%</b><span class="muted">${t('complete','completo')}</span></div><div class="stat"><b>${a.unverified}</b><span class="muted">${t('unverified','sin verificar')}</span></div><div class="stat"><b>${a.missing}</b><span class="muted">${t('missing','faltantes')}</span></div><div class="stat"><b>${a.wanted}</b><span class="muted">${t('wanted','buscadas')}</span></div></div></div><div class="card"><h3>${t('Quick review','Revisión rápida')}</h3><p class="muted">${t('Verify your physical albums one coin at a time. Nothing is assumed to be in your collection.','Confirmá tus álbumes físicos moneda por moneda. No damos ninguna moneda por sentada.')}</p><button class="btn" onclick="openCol('states',true)">▶ ${t('Start review','Comenzar revisión')}</button></div></section><h2>${t('Collections','Colecciones')}</h2><div class="collections">${C.map(collectionCard).join('')}</div>`}
function openCol(id,review=false){S.collection=id;S.page=review?'review':'collectionDetail';S.filter='all';S.sort='release';S.reviewIndex=0;render()}
function coinCard(x){let st=state(x.id),c=C.find(c=>c.id===x.collection);return `<article class="coin"><div><div class="status ${st}">${st==='have'?'✓ '+t('HAVE','LA TENGO'):st==='missing'?'✕ '+t('MISSING','ME FALTA'):'? '+t('UNVERIFIED','SIN VERIFICAR')}</div><h3>${x.title}</h3><div class="meta">${x.year}${x.place?' · '+x.place:''} · ${c.denom}</div><div class="coin-actions"><button class="mini have ${st==='have'?'on':''}" onclick="setState('${x.id}','have')">✓ ${t('Have','Tengo')}</button><button class="mini missing ${st==='missing'?'on':''}" onclick="setState('${x.id}','missing')">✕ ${t('Missing','Falta')}</button><button class="mini" onclick="setState('${x.id}','unverified')">? ${t('Reset','Reset')}</button></div></div><button class="star ${wanted(x.id)?'on':''}" title="Wanted" onclick="toggleWanted('${x.id}')">${wanted(x.id)?'★':'☆'}</button></article>`}
function detail(){let c=C.find(x=>x.id===S.collection),coins=[...c.coins];if(S.filter!=='all')coins=coins.filter(x=>S.filter==='wanted'?wanted(x.id):state(x.id)===S.filter);if(S.sort==='az')coins.sort((a,b)=>a.title.localeCompare(b.title));let a=stats(c.coins);return `<button class="btn back" onclick="go('collections')">← ${t('Collections','Colecciones')}</button><div class="row"><div class="grow"><h1>${c.icon} ${S.lang==='es'?c.es:c.name}</h1><p class="muted">${c.period} · ${c.denom} · ${a.have}/${a.total} ${t('complete','completas')}</p></div><button class="btn" onclick="S.page='review';S.reviewIndex=0;render()">▶ ${t('Review','Revisar')}</button></div><div class="toolbar"><button class="filter ${S.filter==='all'?'active':''}" onclick="S.filter='all';render()">${t('All','Todas')}</button><button class="filter ${S.filter==='have'?'active':''}" onclick="S.filter='have';render()">✓ ${t('Have','Tengo')}</button><button class="filter ${S.filter==='missing'?'active':''}" onclick="S.filter='missing';render()">✕ ${t('Missing','Faltan')}</button><button class="filter ${S.filter==='unverified'?'active':''}" onclick="S.filter='unverified';render()">? ${t('Unverified','Sin verificar')}</button><button class="filter ${S.filter==='wanted'?'active':''}" onclick="S.filter='wanted';render()">★ ${t('Wanted','Buscadas')}</button><span class="grow"></span><div class="seg"><button class="${S.sort==='release'?'active':''}" onclick="S.sort='release';render()">${t('Release','Emisión')}</button><button class="${S.sort==='az'?'active':''}" onclick="S.sort='az';render()">A–Z</button></div></div><div class="coins">${coins.length?coins.map(coinCard).join(''):`<div class="empty">${t('No coins match this filter.','No hay monedas para este filtro.')}</div>`}</div>`}
function collections(){return `<h1>${t('Collections','Colecciones')}</h1><p class="muted">${t('Seven collecting programs. Every design starts unverified until you confirm it.','Siete programas de colección. Cada diseño comienza sin verificar hasta que vos lo confirmes.')}</p><div class="collections">${C.map(collectionCard).join('')}</div>`}
function wantedPage(){let coins=all().filter(x=>wanted(x.id));return `<h1>★ ${t('Wanted','Buscadas')}</h1><p class="muted">${t('Your active hunt list. Marking a coin as Have removes it automatically.','Tu lista activa de búsqueda. Al marcar una moneda como Tengo se quita automáticamente.')}</p><div class="coins">${coins.length?coins.map(coinCard).join(''):`<div class="card empty">${t('No wanted coins yet. Tap ☆ on any coin to add it here.','Todavía no marcaste monedas buscadas. Tocá ☆ en cualquier moneda para agregarla.')}</div>`}</div>`}
function searchPage(){let q=S.query.trim().toLowerCase(),coins=q?all().filter(x=>`${x.year} ${x.place} ${x.title} ${C.find(c=>c.id===x.collection).name}`.toLowerCase().includes(q)):[];return `<h1>⌕ ${t('Search','Buscar')}</h1><input class="searchbox" autofocus placeholder="${t('Search Yosemite, Nevada, 2010, Lincoln…','Buscar Yosemite, Nevada, 2010, Lincoln…')}" value="${S.query.replaceAll('"','&quot;')}" oninput="S.query=this.value;render(false)"><div style="height:14px"></div><div class="coins">${q?(coins.length?coins.map(coinCard).join(''):`<div class="empty">${t('No results.','Sin resultados.')}</div>`):`<div class="card empty">${t('Search across all seven collections.','Buscá en las siete colecciones.')}</div>`}</div>`}
function review(){let c=C.find(x=>x.id===S.collection);let pending=c.coins.filter(x=>state(x.id)==='unverified');if(!pending.length)return `<div class="card review"><h1>✓ ${t('Review complete','Revisión completa')}</h1><p>${S.lang==='es'?c.es:c.name}</p><p class="muted">${t('There are no unverified designs left in this collection.','No quedan diseños sin verificar en esta colección.')}</p><button class="btn" onclick="S.page='collectionDetail';render()">${t('Done','Listo')}</button></div>`;let x=pending[Math.min(S.reviewIndex,pending.length-1)];let done=c.coins.length-pending.length;return `<button class="btn back" onclick="S.page='collectionDetail';render()">← ${t('Back','Volver')}</button><div class="card review"><div class="muted">${done+1} / ${c.coins.length} · ${t('REVIEW MODE','MODO REVISIÓN')}</div><div class="coinface">🪙</div><h1>${x.title}</h1><p class="muted">${x.year}${x.place?' · '+x.place:''} · ${c.denom}</p><h3>${t('Do you have this coin?','¿Tenés esta moneda?')}</h3><div class="review-actions"><button class="btn" onclick="setState('${x.id}','have')">✓ ${t('YES','SÍ')}</button><button class="btn" onclick="setState('${x.id}','missing')">✕ ${t('NO','NO')}</button></div><div style="height:10px"></div><button class="btn" onclick="S.reviewIndex=(S.reviewIndex+1)%pending.length;render()">${t('Skip','Omitir')} →</button></div>`}
function settings(){return `<h1>⚙ ${t('Settings','Ajustes')}</h1><div class="settings-grid"><div class="card setting"><div><b>${t('Theme','Tema')}</b><div class="muted">${t('Dark is the default','Oscuro es el predeterminado')}</div></div><button class="btn" onclick="toggleTheme()">${S.theme==='dark'?'🌙 Dark':'☀️ Light'}</button></div><div class="card setting"><div><b>${t('Language','Idioma')}</b><div class="muted">${t('English is the default','Inglés es el predeterminado')}</div></div><button class="btn" onclick="toggleLang()">${S.lang==='en'?'🇺🇸 English':'🇦🇷 Español'}</button></div><div class="card"><h3>${t('Backup','Backup')}</h3><p class="muted">${t('Export your confirmations and Wanted list to move them between devices.','Exportá tus confirmaciones y la lista de Buscadas para moverlas entre dispositivos.')}</p><button class="btn" onclick="exportData()">⬇ ${t('Export data','Exportar datos')}</button> <label class="btn">⬆ ${t('Import data','Importar datos')}<input class="file" type="file" accept="application/json" onchange="importData(this.files[0])"></label></div><div class="card"><h3>${t('Reset collection','Reiniciar colección')}</h3><p class="muted">${t('Returns every design to Unverified and clears Wanted.','Devuelve todos los diseños a Sin verificar y borra Buscadas.')}</p><button class="btn" onclick="resetData()">⚠ ${t('Reset all data','Borrar todos los datos')}</button></div></div><div style="height:14px"></div><div class="notice">${t('Catalog scope: one entry per design. Mint marks, duplicates, condition, purchase price and acquisition history are intentionally not tracked.','Alcance del catálogo: una entrada por diseño. Intencionalmente no registramos ceca, duplicados, conservación, precio ni historial de adquisición.')}</div>`}
function toggleTheme(){S.theme=S.theme==='dark'?'light':'dark';localStorage.coinTheme=S.theme;render()} function toggleLang(){S.lang=S.lang==='en'?'es':'en';localStorage.coinLang=S.lang;render()}
function exportData(){let blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),data:D},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='US_Coin_Collection_Backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result);D=j.data||j;save();render();alert(t('Import complete.','Importación completa.'))}catch(e){alert(t('Invalid backup file.','Archivo de backup inválido.'))}};r.readAsText(f)}
function resetData(){if(confirm(t('Reset ALL collection data? This cannot be undone unless you exported a backup.','¿Borrar TODOS los datos de la colección? No se puede deshacer salvo que hayas exportado un backup.'))){D={};save();render()}}
function render(focus=true){document.documentElement.dataset.theme=S.theme;document.getElementById('langBtn').textContent=S.lang.toUpperCase();document.getElementById('themeBtn').textContent=S.theme==='dark'?'🌙':'☀️';let html=S.page==='home'?home():S.page==='collections'?collections():S.page==='collectionDetail'?detail():S.page==='wanted'?wantedPage():S.page==='search'?searchPage():S.page==='review'?review():settings();document.getElementById('main').innerHTML=html;nav();if(!focus&&S.page==='search'){let el=document.querySelector('.searchbox');if(el){let n=el.value.length;el.focus();el.setSelectionRange(n,n)}}}
document.getElementById('langBtn').onclick=toggleLang;document.getElementById('themeBtn').onclick=toggleTheme;render();
</script></body></html>
